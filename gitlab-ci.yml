stages:
  - release

create-release:
  stage: release
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG  # Nur bei Tags ausführen
  before_script:
    - apk add --no-cache zip curl
  script:
    # 1. ZIP-Archiv der Konfigurationsdateien erstellen
    - zip -r "configs-${CI_COMMIT_TAG}.zip" configs/

    # 2. ZIP als Generic Package hochladen
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "configs-${CI_COMMIT_TAG}.zip" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/configs/${CI_COMMIT_TAG}/configs-${CI_COMMIT_TAG}.zip"

    # 3. GitLab Release erstellen mit ZIP als Asset
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --header "Content-Type: application/json" \
           --data "{
             \"name\": \"Release ${CI_COMMIT_TAG}\",
             \"tag_name\": \"${CI_COMMIT_TAG}\",
             \"description\": \"Automatisch erstelltes Release für Tag ${CI_COMMIT_TAG}\",
             \"assets\": {
               \"links\": [
                 {
                   \"name\": \"configs-${CI_COMMIT_TAG}.zip\",
                   \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/configs/${CI_COMMIT_TAG}/configs-${CI_COMMIT_TAG}.zip\",
                   \"link_type\": \"package\"
                 }
               ]
             }
           }" \
           --request POST \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  tags:
    - docker  # Muss zum Runner-Tag passen